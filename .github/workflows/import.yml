name: import-site
on:
  push:
    paths:
      - .github/workflows/import.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built pages
        run: |
          mkdir -p backup
          curl -fsSL -o index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/11/75cba6c9.html?expires=1794387625&sig=99f34f784e7a0eb5413acb64ec1fc25f5a780a757c0d139e58c710b794222f75'
          curl -fsSL -o backup/index.html 'https://sg.migoo.ai/beeai/api/v1/media/signed/budee/2026/11/11/35365628.html?expires=1794385847&sig=99ca43606ad20f97db12263c47aa193a807b7e1d1727082534d18d250f140340'
          echo 'dd731905e75fd6da40ec562b0c6745d561de6b8c502a0aaf528d04f85dcedd35  index.html' | sha256sum -c -
          echo 'c645adb67830453b0d47b92a00d94b92b76b01bbf91620a7dfb1e0f110918937  backup/index.html' | sha256sum -c -
          git rm -q .github/workflows/import.yml
      - name: Commit
        run: |
          git config user.name 'hhoshizora-usagi'
          git config user.email '333192191+hhoshizora-usagi@users.noreply.github.com'
          git add index.html backup/index.html
          git commit -m 'EPIC DAY.3 v2: neon + drag sphere (index) and original sphere backup (/backup/)'
          git push
